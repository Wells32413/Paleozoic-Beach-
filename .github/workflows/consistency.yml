name: Repository consistency
on: [push, pull_request]
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_project.py
      - run: python tools/test_unity_test_gate.py
      - run: bash -n tools/export-ios.sh
